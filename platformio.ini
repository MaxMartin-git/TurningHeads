[platformio]
default_envs = coordinator

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

[env:coordinator]
lib_deps =
	workloads/SCServo @ ^1.0.1
	ESP32Async/AsyncTCP @ ^3.3.2
	ESP32Async/ESPAsyncWebServer @ ^3.6.0
build_src_filter =
	+<main.cpp>

[env:node]
lib_deps =
	workloads/SCServo @ ^1.0.1
build_src_filter =
	+<main_node.cpp>
