[platformio]
default_envs = coordinator

[env:coordinator]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
upload_port = COM6
monitor_port = COM6
monitor_speed = 115200
lib_deps =
	workloads/SCServo @ ^1.0.1
	ESP32Async/AsyncTCP @ ^3.3.2
	ESP32Async/ESPAsyncWebServer @ ^3.6.0
build_src_filter =
	+<main.cpp>

[env:node]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
upload_port = COM6
monitor_port = COM6
monitor_speed = 115200
lib_deps =
	workloads/SCServo @ ^1.0.1
build_src_filter =
	+<main_node.cpp>
